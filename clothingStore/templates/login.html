{% extends "base.html" %}
{% block title %}Вход{% endblock title %}
{% block header %}Вход{% endblock header %}

{% block content %}
    <style>
        .login-container {
            max-width: 400px;
            margin: 0 auto;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
        }

        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .login-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-container label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .login-container input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            width: 95%;
        }

        .login-container button {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .messages {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            list-style: none;
            font-size: 0.9rem;
        }

        .messages li {
            margin-bottom: 5px;
        }

        .messages .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .messages .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>

    <div class="login-container">
        <h2>Вход</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Войти</button>
        </form>

        <!-- Сообщения об ошибках или успешных действиях -->
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
{% endblock content %}
